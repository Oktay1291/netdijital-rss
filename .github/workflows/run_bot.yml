name: NetDijital RSS Bot

on:
  schedule:
    # Türkiye saati ile sabah 06:00 - gece 00:00 arası her saat başı çalışır.
    # (UTC saatine göre 03:00 ile 21:00 arasıdır)
    - cron: '0 3-21 * * *'
  workflow_dispatch:      # İstediğin zaman elle test edebilmen için bu kalsın

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        run: python rss_bot.py

      - name: Değişiklikleri GitHub'a Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yayinlanan_haberler.txt
          git diff --staged --quiet || git commit -m "NetDijital Otomatik Güncelleme: Yeni haberler eklendi"
          git push
