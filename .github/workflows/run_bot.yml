# Zamanlayıcıyı 30 dakikada bir çalışacak şekilde ayarla
on:
  schedule:
    - cron: '*/30 * * * *'

# ... (Python çalıştırma adımların) ...

      - name: Hafıza dosyasını Github'a kaydet (Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add yayinlanan_haberler.txt
          git commit -m "Otomatik Güncelleme: Yayınlanan haberler hafızaya eklendi" || echo "Değişiklik yok"
          git push
