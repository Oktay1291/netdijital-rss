name: Saatlik Teknoloji Haber Botu

on:
  workflow_dispatch:
  schedule:
    # Türkiye saati 06:00 - 22:00 (UTC+3)
    # GitHub Actions cron UTC kullanir: 03:00 - 19:00 UTC
    - cron: "0 3-19 * * *"

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          pip install \
            feedparser \
            requests \
            beautifulsoup4 \
            google-genai \
            pillow

      - name: Haber Botunu Çalıştır
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python rss_bot.py
