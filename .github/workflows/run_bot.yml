name: NetDijital RSS Bot

on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir çalışır
  workflow_dispatch:      # Manuel çalıştırma butonu

permissions:
  contents: write         # Commit atabilmek için yetki (403 engelini önler)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır
        run: python rss_bot.py

      - name: Değişiklikleri GitHub'a Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yayinlanan_haberler.txt
          git diff --staged --quiet || git commit -m "NetDijital Otomatik Güncelleme: Yeni haberler eklendi"
          git push
