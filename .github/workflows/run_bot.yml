name: NetDijital RSS Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netdijital-rss-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-genai feedparser requests beautifulsoup4

      - name: Botu Çalıştır
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python rss_bot.py

      - name: Geçmiş Dosyasını Commit Et
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f posted_history.json ]; then
            echo "posted_history.json bulunamadi, commit atlaniyor."
            exit 0
          fi

          git add posted_history.json

          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlaniyor."
            exit 0
          fi

          git commit -m "Auto: gecmis guncellendi [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
